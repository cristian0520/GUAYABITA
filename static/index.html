<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Guayabita - Sala de Casino</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="casino-background">
        <div class="table-felt">
            <header>
                <h1>La Guayabita 🎲</h1>
                <p>Casino en Vivo • Apuestas en Pesos Colombianos ($COP)</p>
            </header>

            <main id="app">
                <!-- Sección de Creación de Mesa -->
                <section class="card-box">
                    <h2>Crear Nueva Sala de Juego</h2>
                    <div class="form-group">
                        <label>Tu Nombre de Jugador:</label>
                        <input type="text" id="hostName" placeholder="Ej. Cristian" maxlength="20">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Apuesta Mínima ($COP):</label>
                            <input type="number" id="anteInput" value="300" min="300" step="100">
                        </div>
                        <div class="form-group">
                            <label>Recarga Inicial ($COP):</label>
                            <input type="number" id="chipsInput" value="15000" min="300" step="1000">
                        </div>
                    </div>

                    <button class="btn-primary" onclick="createGame()">Crear Mesa Privada</button>
                </section>

                <!-- Sección para Unirse con Código -->
                <section class="card-box">
                    <h2>¿Ya tienes un código de mesa?</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Código de la Mesa:</label>
                            <input type="text" id="joinCode" placeholder="Ej. ABCDE" style="text-transform: uppercase;">
                        </div>
                        <div class="form-group">
                            <label>Tu Nombre:</label>
                            <input type="text" id="joinName" placeholder="Ej. Amigo" maxlength="20">
                        </div>
                    </div>
                    <button class="btn-secondary" onclick="joinGame()">Entrar a la Sala</button>
                </section>
            </main>

            <!-- Animación de Dado 3D -->
            <div class="dice-container-3d">
                <div class="dice-3d">
                    <div class="face front">🎲</div>
                    <div class="face back">♠️</div>
                    <div class="face right">♣️</div>
                    <div class="face left">♥️</div>
                    <div class="face top">♦️</div>
                    <div class="face bottom">💰</div>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
